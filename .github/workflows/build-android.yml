name: Build Android APK

on:
  push:
    branches: [ game-initial-setup, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Install dependencies
      run: npm install
    
    - name: Create www directory and copy all files
      run: |
        mkdir -p www
        cp -v index.html www/
        cp -rv css www/
        cp -rv js www/
        echo "=== Verifying files in www ==="
        ls -laR www/
        echo "=== Checking js files ==="
        find www/js -name "*.js" -ls
      
    - name: Add Android platform
      run: npx cap add android
      
    - name: Sync Capacitor
      run: npx cap sync android
      
    - name: Verify Android assets
      run: |
        echo "=== Android assets directory ==="
        ls -la android/app/src/main/assets/public/
        
    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew
      
    - name: Build Android Debug APK
      working-directory: android
      run: ./gradlew assembleDebug --no-daemon --stacktrace
      
    - name: Verify APK size and contents
      run: |
        echo "=== APK file info ==="
        ls -lh android/app/build/outputs/apk/debug/app-debug.apk
        file android/app/build/outputs/apk/debug/app-debug.apk
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: monster-clicker-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
