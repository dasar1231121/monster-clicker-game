name: Build Android APK

on:
  push:
    branches: [ game-initial-setup, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Install dependencies
      run: npm install
    
    - name: Prepare www directory BEFORE adding Android
      run: |
        echo "=== Creating www directory ==="
        mkdir -p www/css www/js
        echo "=== Copying index.html ==="
        cp -v index.html www/
        echo "=== Copying CSS ==="
        cp -rv css/* www/css/
        echo "=== Copying JS files ==="
        cp -rv js/* www/js/
        echo "=== Verifying all files copied ==="
        ls -laR www/
        echo "=== Counting JS files ==="
        find www/js -name "*.js" | wc -l
        echo "Should be 14 JS files!"
      
    - name: Add Android platform (files already in www)
      run: npx cap add android
      
    - name: Sync Capacitor
      run: npx cap sync android
      
    - name: Verify files in Android assets
      run: |
        echo "=== Checking Android assets ==="
        if [ -d "android/app/src/main/assets/public" ]; then
          ls -laR android/app/src/main/assets/public/
          echo "=== Counting JS in Android assets ==="
          find android/app/src/main/assets/public -name "*.js" | wc -l
        else
          echo "ERROR: public folder not found!"
        fi
        
    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew
      
    - name: Build Android Debug APK
      working-directory: android
      run: ./gradlew assembleDebug --no-daemon --stacktrace
      
    - name: Check APK size
      run: |
        echo "=== APK Information ==="
        ls -lh android/app/build/outputs/apk/debug/app-debug.apk
        SIZE=$(stat -f%z android/app/build/outputs/apk/debug/app-debug.apk 2>/dev/null || stat -c%s android/app/build/outputs/apk/debug/app-debug.apk)
        echo "APK size: $SIZE bytes"
        if [ $SIZE -lt 5000000 ]; then
          echo "WARNING: APK is smaller than 5MB - files might be missing!"
        else
          echo "SUCCESS: APK size looks good!"
        fi
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: monster-clicker-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
