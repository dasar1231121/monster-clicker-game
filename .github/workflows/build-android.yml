name: Build Android APK

on:
  push:
    branches: [ game-initial-setup, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Install Capacitor CLI globally
      run: npm install -g @capacitor/cli
      
    - name: Initialize Capacitor (if needed)
      run: |
        if [ ! -f "capacitor.config.json" ]; then
          npx cap init "Monster Clicker RPG" "com.dasar1231121.monsterclicker" --web-dir="."
        fi
      
    - name: Add Android platform
      run: |
        if [ ! -d "android" ]; then
          npx cap add android
        fi
      
    - name: Copy web assets
      run: npx cap copy android
      
    - name: Update Android project
      run: npx cap update android
      
    - name: Sync Capacitor
      run: npx cap sync android
      
    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew
      
    - name: Build Android Debug APK
      working-directory: android
      run: ./gradlew assembleDebug --no-daemon --stacktrace
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: monster-clicker-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
